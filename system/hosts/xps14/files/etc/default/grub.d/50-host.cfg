# xps14 kernel parameters. Panther Lake has no S3; make s2idle explicit so a
# firmware default can never pick a mode that does not resume.
# zswap off: swap is zram (zram-generator.conf); zswap in front of it compresses
# every page twice and its writeback is what pushed pages out to disk swap.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} mem_sleep_default=s2idle zswap.enabled=0"
