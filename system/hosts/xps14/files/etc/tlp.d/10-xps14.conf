# xps14 (Dell XPS 14 DA14260, Panther Lake, Arc B390 via xe, s2idle) -- TLP 1.10 overrides.
# Research and rationale: $NOTES/Homelab/dotfiles/runs/2026-10-17-xps14-battery/ (20-tlp-config.md).
# Verify after apply: sudo tlp-stat -c (sources), -w (no warnings), -b (charge type [Custom]).

# --- Battery care: thresholds deliberately OFF (2026-10-24) -------------------
# Any START/STOP_CHARGE_THRESH makes TLP's dell plugin (bat.d/65-dell) write
# "Custom" to charge_types, and Custom disables ExpressCharge: the EC then
# charges at ~0.75 A / 9 W (4+ h to full) regardless of the thresholds, even
# 95/100. TLP has no option to keep "Fast" with thresholds, so the previous
# 50/75 longevity setting cost ~2.5x charge speed. Decision: fast charging
# (EC "Fast" = ExpressCharge, ~1.8 A+ / 22 W+) over charge limiting.
# With no thresholds TLP leaves charge_types alone; the EC setting persists.
# If it ever shows [Custom]: echo Fast | sudo tee /sys/class/power_supply/BAT0/charge_types
# Verify: tlp-stat -b -> charge_types = Trickle [Fast] Standard Adaptive Custom
# History/rationale: $NOTES/Homelab/dotfiles/runs/2026-10-17-xps14-battery/20-tlp-config.md
#START_CHARGE_THRESH_BAT0=50
#STOP_CHARGE_THRESH_BAT0=75
#RESTORE_THRESHOLDS_ON_BAT=1

# --- Pinned stock defaults (no behaviour change; drift shows in tlp-stat -c) ---
# intel_pstate HWP active: EPP does the work, no frequency clamps (TLP docs:
# CPU_MAX_PERF_ON_BAT "may not conserve power" in active mode). Do not set
# EPP=power, no_turbo or min/max perf without a quiesced measurement.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
# This firmware only exposes "balanced performance" (the kernel intersects
# Intel's SoC Power Slider with Dell's dell-pc handler), so low-power is
# unavailable; balanced is the floor.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
# xe SLPC power profile (kernel >= 6.18). Frequency clamps left to the driver.
INTEL_GPU_POWER_PROFILE_ON_AC=base
INTEL_GPU_POWER_PROFILE_ON_BAT=power_saving
# "performance" blocks deep package C-states (TLP #344); powersupersave is
# unverified with USB4 + a DRAM-less NVMe on this platform. default it is.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
USB_AUTOSUSPEND=1
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
