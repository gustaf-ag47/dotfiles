# Bluetooth headphones: stay on A2DP (high-quality stereo) when a call app opens
# a microphone. WirePlumber's default switches to the headset profile (HFP),
# which drops output to 16 kHz mono. The internal mic array (via "Microphone
# (clean)") is better than any HFP mic.
wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}
