# Clean voice source for the XPS 14 internal mic array (dotfiles xps14 host).
# Chain: DSP (beamformer + DRC, on the SOF side) -> stereo-to-mono downmix ->
# 80 Hz high-pass (rumble, desk thumps, fan) -> corrective EQ -> RNNoise -> -1 dBFS
# brickwall limiter (LSP; catches laughs/plosives the DRC lets through). Exposed as
# "Microphone (clean)", ranked above the raw mic so it becomes the default.
# Leave the raw source at 100% (unity) and don't add gain here; the DSP DRC
# already compresses. Browsers still run their own WebRTC AEC/AGC on top.
# Turn off Meet's own noise cancellation when using this to avoid denoising twice.
# Research notes: $NOTES/Homelab/dotfiles/XPS14-CAMERA-MIC.md
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (clean)"
            media.name       = "Microphone (clean)"
            filter.graph = {
                nodes = [
                    {   type  = builtin
                        name  = hpf
                        label = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    }
                    # Corrective EQ, measured 2026-10-23 from 22 s of read speech vs the
                    # Byrne 1994 LTASS: this array (plus Dell's DSP voice tuning) runs
                    # +8..+10 dB at 2-4 kHz and +4..+5 dB at 8-12.5 kHz (split-half
                    # agreement within 2 dB). Cuts leave ~+2..+5 dB of presence on
                    # purpose (intelligibility through Opus). Before RNNoise so its
                    # model sees a natural spectrum.
                    {   type = builtin  name = eq1  label = bq_peaking
                        control = { "Freq" = 2300.0 "Q" = 1.8 "Gain" = -4.0 } }
                    {   type = builtin  name = eq2  label = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 2.0 "Gain" = -5.0 } }
                    {   type = builtin  name = eq3  label = bq_peaking
                        control = { "Freq" = 11000.0 "Q" = 1.0 "Gain" = -3.0 } }
                    {   type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_mono
                        control = {
                            # Gate non-speech frames; 200 ms grace avoids chopped word
                            # endings, 30 ms retroactive grace keeps word onsets.
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 30
                        }
                    }
                    {   type   = ladspa
                        name   = limiter
                        plugin = "lsp-plugins-ladspa"
                        label  = "http://lsp-plug.in/plugins/ladspa/limiter_mono"
                        control = {
                            "Threshold (G)" = 0.891
                            "Gain boost"    = 0
                            "Automatic level regulation" = 0
                            "Lookahead (ms)" = 5.0
                        }
                    }
                ]
                links = [
                    { output = "hpf:Out"        input = "eq1:In" }
                    { output = "eq1:Out"        input = "eq2:In" }
                    { output = "eq2:Out"        input = "eq3:In" }
                    { output = "eq3:Out"        input = "rnnoise:Input" }
                    { output = "rnnoise:Output" input = "limiter:Input" }
                ]
            }
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name      = "capture.mic_clean"
                node.passive   = true
                target.object  = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Mic__source"
                stream.dont-remix = false
            }
            playback.props = {
                node.name        = "mic_clean"
                node.description = "Microphone (clean)"
                media.class      = Audio/Source
                priority.session = 2000
                priority.driver  = 2000
            }
        }
    }
]
