# Dell XPS 14 DA14260: the camera is mounted upside down but ACPI reports
# rotation 0, so every app showed it rotated 180 degrees. The `rotation`
# parameter exists only in the patched DKMS module (/usr/src/ov08x40-cvs-1.1);
# the in-tree module ignores unknown options with a warning.
options ov08x40 rotation=180
