# Speaker amps vs. camera vision chip: shared GPIO race (Dell XPS 14 DA14260).
#
# ACPI gives the four CS35L57 amps an spk-id GPIO that the camera's CVS chip
# driver (intel_cvs) also claims as its wake IRQ. Whichever probes first wins;
# when intel_cvs wins, the amps fail with -EBUSY and the machine boots with NO
# sound card. Reported on about half of all boots.
#
# Stop udev autoloading intel_cvs; intel-cvs-late.service loads it once the
# amps have bound. An explicit `modprobe intel_cvs` still works.
#
# RETIRE when the kernel carries "media: i2c: cvs: Get the wake IRQ without
# claiming the GPIO": delete this file (the service is conditional on it),
# reboot a few times, confirm `journalctl -b -k | grep spk-id` stays empty.
blacklist intel_cvs
