# XPS 14 (DA14260) panel LG RW24G140WT2: brightness works only over eDP AUX
# (DPCD 0x702 BRIGHTNESS_AUX_SET_CAP=1, BRIGHTNESS_PWM_PIN_CAP=0). xe's VBT
# default drives the PWM pin, so intel_backlight changes nothing and the panel
# sits at full brightness (DPCD 0x722 = 0xffff). 2 = force the VESA AUX
# interface (the panel's firmware already runs in DPCD mode, 0x721 = 0x82).
# Needs the initramfs rebuilt (modconf hook) and a reboot.
options xe enable_dpcd_backlight=2
