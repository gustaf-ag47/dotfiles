# SPDX-License-Identifier: CC0-1.0
# OV08X40 tuning for libcamera's software ISP (Dell XPS 14 DA14260 camera).
# libcamera 0.7.2 ships none and falls back to uncalibrated.yaml (flat, grey
# colours). This is Armin Felder's measured file (ColorChecker CCMs, measured
# black level; CJFME55 module, ThinkPad X1 Gen13), posted upstream unmerged:
# https://patchwork.libcamera.org/patch/28297/
# A/B on this laptop (2026-10-23, GPU debayer, 1280x720): clearly better
# colour than uncalibrated, same 28.6 fps.
# RETIRE when /usr/share/libcamera/ipa/*/ov08x40.yaml exists (upstream merged);
# newer libcamera renames the IPA dir simple/ -> softisp/.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2100
          ccm: [ 1.7821, -0.4268, -0.3553,
                 -0.5415, 1.6171, -0.0757,
                 -0.7540, -2.0015, 3.7555 ]
        - ct: 2300
          ccm: [ 1.7411, -0.4919, -0.2491,
                 -0.4701, 1.5998, -0.1298,
                 -0.4854, -1.7248, 3.2103 ]
        - ct: 2500
          ccm: [ 1.7245, -0.4994, -0.2250,
                 -0.4298, 1.6132, -0.1834,
                 -0.3432, -1.5515, 2.8947 ]
        - ct: 2700
          ccm: [ 1.7072, -0.5134, -0.1938,
                 -0.3948, 1.6203, -0.2255,
                 -0.2409, -1.3825, 2.6234 ]
        - ct: 2900
          ccm: [ 1.7261, -0.5497, -0.1764,
                 -0.3584, 1.6376, -0.2792,
                 -0.1658, -1.2535, 2.4193 ]
        - ct: 3700
