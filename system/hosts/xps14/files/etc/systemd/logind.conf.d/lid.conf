[Login]
# Closing the lid never suspends: the laptop is a desk machine with external
# monitors and long-running tmux/pi/ssh sessions. Hyprland turns the internal
# panel off on lid close (hosts/xps14.conf switch binds). Suspend by hand with
# `systemctl suspend`.
#
# Takes effect at the next login. NEVER `systemctl restart systemd-logind` under
# a running Hyprland: libseat loses seat control and the compositor freezes.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
