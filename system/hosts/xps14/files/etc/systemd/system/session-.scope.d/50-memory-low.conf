# Hyprland, Xwayland, the tmux server and Firefox run in the login session
# scope. MemoryLow alone is soft: under an agent burst (10G hot set in
# agents.slice) the kernel breached it 1.7M times (memory.events "low") and
# swapped Hyprland/tmux out: 12686/5955 major faults per 100 s, 724k anon
# refaults. MemoryMin is never reclaimed: same burst, 11/14 faults, 853
# refaults (xps14 2026-11-21).
[Scope]
MemoryMin=4G
MemoryLow=6G
