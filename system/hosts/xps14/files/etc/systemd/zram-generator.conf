# xps14 swap: zram first, disk swap (/swapfile, nvme0n1p2) only as overflow.
# ram/2 (16G) filled up under an agent fleet and spilled cold pages to the
# LUKS-encrypted disk swap; every swap-in then stalled tmux and Firefox (io PSI
# ~50%, tmux server ~1300 major faults/s on 2026-11-19). zstd holds ~3.4:1 here,
# so a full 32G device costs ~9G of RAM.
[zram0]
zram-size = min(ram, 32768)
compression-algorithm = zstd
swap-priority = 100
