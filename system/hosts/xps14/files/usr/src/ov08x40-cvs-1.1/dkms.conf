# ov08x40 without the 1928x1088 binned mode (Dell XPS 14 DA14260 camera).
#
# The sensor sits behind the Intel CVS chip, which only passes 1928x1088 as
# sHDR; the in-tree driver programs it as linear, so every frame arrives as
# 0xffff. libcamera picks that mode for any request <= 1080p (all of WebRTC)
# and its software ISP aborts on the out-of-range samples, killing WirePlumber.
# Hiding the mode makes libcamera use 3856x2176 and scale down (28.6 fps).
#
# Source: in-tree drivers/media/i2c/ov08x40.c from v7.2.10 with the mode entry
# removed, after https://patchwork.linuxtv.org/project/linux-media/patch/20260904134604.595685-1-pierre@pinon1.fr/
# (Tested-by on this exact model, 2026-10-17). Installs to updates/, which
# depmod prefers over the in-tree module.
#
# RETIRE when the kernel (or intel_cvs) stops offering 1928x1088 behind CVS:
# remove this directory and `dkms remove ov08x40-cvs/1.1 --all`.
PACKAGE_NAME="ov08x40-cvs"
PACKAGE_VERSION="1.1"
BUILT_MODULE_NAME[0]="ov08x40"
DEST_MODULE_LOCATION[0]="/kernel/drivers/media/i2c"
AUTOINSTALL="yes"
