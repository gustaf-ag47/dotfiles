[Login]
# Closing the lid never suspends: always-on machine with long-running
# tmux/pi/ssh sessions. Hyprland turns the internal panel off on lid close
# (hosts/arch.conf switch binds, DPMS only: see HARDWARE.md). Suspend by hand
# with `systemctl suspend`.
#
# Takes effect at the next boot. NEVER `systemctl restart systemd-logind` under
# a running Hyprland: libseat loses seat control and the compositor freezes.
# Until the reboot, bin/lid-inhibit holds a handle-lid-switch inhibitor.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
