# arch (Dell XPS 15) kernel parameters. Rationale: CLAUDE.md, "Kernel cmdline".
#   i915.enable_psr=0     eDP link fails to retrain on s2idle resume (black screen)
#   pcie_aspm=off         ASPM transitions race NVIDIA S0ix resume (hangs)
#   acpi_osi=!ACPI-Video  stops D-Notifier events reaching nvidia mid-resume
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} i915.enable_psr=0 pcie_aspm=off acpi_osi=!ACPI-Video"
