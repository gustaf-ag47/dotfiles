# AX211 (so-a0-gf-a0) microcode SW error / NMI_INTERRUPT_HOST crash-loop mitigation.
# Symptom: repeated "Microcode SW error detected. Restarting" + "Device error - SW reset"
# in dmesg, causing WiFi to drop and degrade. Firmware 89.x on linux-firmware
# 20260622 does not fix it. These options disable the power/offload features that
# trigger the firmware fault.

# Disable adaptive WiFi power management (keep the radio fully active).
options iwlmvm power_scheme=1

# Disable Bluetooth<->WiFi coexistence signalling (a known NMI trigger on CNVi).
options iwlwifi bt_coex_active=0

# Keep WiFi power-save off and disable U-APSD (idle power transition offload).
options iwlwifi power_save=0 uapsd_disable=1

# --- ESCALATION (uncomment ONE if crashes persist after reboot) ---
# Drops you from Wi-Fi 6E to Wi-Fi 5 speeds but is the most reliable stabiliser:
options iwlwifi disable_11ax=1
# Or disable 11n aggregation only:
#options iwlwifi 11n_disable=1
