# Bluetooth optimization for better range and stability

# Disable Bluetooth USB autosuspend to prevent connection drops
# Improves stability, especially during audio streaming
options btusb enable_autosuspend=n

# Intel WiFi: Reduce Bluetooth/WiFi coexistence interference
# Helps when using 2.4 GHz WiFi and Bluetooth simultaneously
# Uncomment if you experience dropouts with Intel WiFi adapters
# options iwlwifi bt_coex_active=n

# Disable WiFi power saving to prevent Bluetooth interference
# WiFi and Bluetooth share the same 2.4 GHz band and can interfere
options iwlwifi power_save=0
