# NVIDIA suspend/resume for s2idle (S0ix) on Dell XPS 15
#
# EnableS0ixPowerManagement activates the S0ix path and implicitly enables
# UseKernelSuspendNotifiers, which registers kernel PM callbacks to save/restore
# GPU state. Because the kernel notifiers handle this, the nvidia-suspend/resume/
# hibernate systemd services must be DISABLED to avoid double-handling GPU state,
# which corrupts the driver on resume.
#
# Hyprland is separately protected by /etc/systemd/system-sleep/hyprland-sigstop,
# which sends SIGSTOP before GPU suspend and SIGCONT after resume. This prevents
# Hyprland from issuing DRM ioctls during the GPU transition, which would block
# for ~20s on the NVIDIA driver timeout and then cause Hyprland to exit().
#
# Run after changes: sudo mkinitcpio -P

# Preserve GPU video memory allocations across suspend/resume.
options nvidia NVreg_PreserveVideoMemoryAllocations=1

# Enable S0ix (s2idle / Modern Standby) power management.
# This laptop has no S3; s2idle is the only sleep mode available.
options nvidia NVreg_EnableS0ixPowerManagement=1

# Limit dynamic power management to mode 1 (power off when inactive).
# Mode 2/3 (the default on laptops) causes GSP Xid 120 task panics on resume
# with nvidia-open 595 on Optimus/hybrid systems.
options nvidia NVreg_DynamicPowerManagement=0x01
