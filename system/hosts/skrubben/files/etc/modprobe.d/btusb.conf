# Disable USB autosuspend for the Bluetooth radio.
# btusb calls usb_enable_autosuspend() during probe, which overrides any udev
# rule that ran on the earlier "add" event. Setting the module param is the
# only fix that applies before the driver touches power/control.
# NOTE: "enable_sco" was previously set here and is NOT a valid btusb
# parameter (see: modinfo btusb) - unknown params make the module load fail.
options btusb enable_autosuspend=0
