# systemd-oomd only learns ManagedOOM* settings from PID 1 at its own start.
# It starts ~10s before user@1000, so the kill policy in 50-memory-bound.conf
# was never registered (oomctl: no monitored cgroups) and the 2026-11-02
# thrash froze the host without a single kill. Re-register once the user
# manager is up; --no-block avoids a job deadlock.
[Service]
ExecStartPost=+-/usr/bin/systemctl --no-block try-restart systemd-oomd.service
