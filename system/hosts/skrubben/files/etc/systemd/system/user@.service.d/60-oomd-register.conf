# On 2026-11-03 systemd-oomd monitored no cgroups at all (oomctl dump empty), so
# the kill policy in 50-memory-bound.conf never applied and the 2026-11-02 thrash
# froze the host with zero kills. Cause unrecovered (journal vacuumed); oomd does
# pick up units started later. Belt and braces: re-register when the user manager
# starts; host-pressure-alert warns if the registration is missing.
# --no-block avoids a job deadlock.
[Service]
ExecStartPost=+-/usr/bin/systemctl --no-block try-restart systemd-oomd.service
