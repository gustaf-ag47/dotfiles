# Models (20 GB) on the ZFS HDD pool (dataset backup/ollama), not the 228 GB root disk that CI runners keep
# near host-pressure-alert's 90% line (2026-11-08). KEEP_ALIVE=-1, so the slower
# HDD only costs one load per restart.
[Unit]
RequiresMountsFor=/srv/ollama-models
[Service]
Environment=OLLAMA_MODELS=/srv/ollama-models
