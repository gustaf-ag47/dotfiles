#
# https://nixos.org/manual/nix/stable/#sec-conf-file
#
# Managed by system/hosts/skrubben (nix/agent-git flake needs flakes enabled).
# The Arch `nix` package's post-install hook also writes this file with just
# the build-users-group line; this copy keeps that line so a pacman upgrade
# that regenerates it doesn't silently drop flakes support unnoticed (compare
# with `scripts/install-system.sh` drift check).

# Unix group containing the Nix build user accounts
build-users-group = nixbld
experimental-features = nix-command flakes
