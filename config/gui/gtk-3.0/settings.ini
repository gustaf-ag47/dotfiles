[Settings]
# Tokyo Night across the desktop; bin/theme-apply pushes the same values into
# gsettings (what GTK4/libadwaita and portals read) and sets the Hyprland cursor.
gtk-theme-name=Tokyonight-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Inter 11
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1

gtk-toolbar-style=GTK_TOOLBAR_BOTH
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=1
gtk-menu-images=1

gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-error-bell=0
gtk-primary-button-warps-slider=1

# No gtk-xft-dpi: Wayland clients get the per-monitor scale from the compositor;
# a fixed 192 doubled everything on 1.5x/1.6x panels.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
