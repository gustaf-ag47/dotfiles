# Chromium flags (Arch reads ~/.config/chromium-flags.conf). Linked by scripts/install.sh.
# Native Wayland.
--enable-features=UseOzonePlatform,AcceleratedVideoDecodeLinuxGL
--ozone-platform=wayland
# AcceleratedVideoDecodeLinuxGL (Chromium >= 130 name, verified against 154)
# enables VA-API video decode on Linux; the driver side is LIBVA_DRIVER_NAME=iHD
# from config/gui/Wayland/hypr/gpu/intel.conf and vainfo shows H264/HEVC/VP9/AV1.
# Software decode of a 1080p stream costs multiple watts on battery.
# Check: chrome://gpu -> "Video Decode: Hardware accelerated".
