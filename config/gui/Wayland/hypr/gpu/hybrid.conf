# GPU overlay: hybrid -- Intel iGPU drives the displays, NVIDIA dGPU on demand
# (Optimus; e.g. arch, the XPS 15). Linked to ~/.config/hypr-gpu.conf.
#
# GBM_BACKEND=nvidia-drm is intentionally omitted: it broke with nvidia-open 555+
# and causes DRM device failures on resume from s2idle.
# Display renders on the Intel iGPU (i915), so VA-API must use the Intel iHD
# driver for hardware video decode. Setting this to "nvidia" (with no nvidia
# VA-API driver installed) forced Firefox into CPU software decoding = lag.
env = LIBVA_DRIVER_NAME,iHD
# __GLX_VENDOR_LIBRARY_NAME,nvidia removed: it forced GLX/Xwayland apps onto the
# idle NVIDIA GPU while the compositor runs on Intel, hurting performance.

cursor {
    # Compositor runs on the Intel iGPU, which supports hardware cursors.
    # true forced a full-screen recomposite on every mouse move (major lag on dual-4K).
    no_hardware_cursors = false
}
