# GPU overlay: intel -- the Intel iGPU drives every display (e.g. xps14).
# Linked to ~/.config/hypr-gpu.conf by scripts/install.sh from PROFILE_GPU.

# VA-API hardware video decode through Intel's iHD driver (intel-media-driver).
env = LIBVA_DRIVER_NAME,iHD

cursor {
    # The iGPU supports hardware cursors. true forces a full-screen recomposite
    # on every mouse move (major lag on dual-4K).
    no_hardware_cursors = false
}
