# GPU overlay: nvidia -- an NVIDIA dGPU drives every display (e.g. skrubben,
# RTX 2080 Ti with no iGPU in use). Linked to ~/.config/hypr-gpu.conf.
#
# LIBVA_DRIVER_NAME is deliberately unset. The old shared config forced "iHD"
# here too, which on an NVIDIA-only machine pointed at a driver that is not
# installed -- equivalent to unset. Hardware decode on NVIDIA needs
# libva-nvidia-driver plus LIBVA_DRIVER_NAME=nvidia; not enabled yet.

cursor {
    # Unchanged from the previous shared setting, which skrubben has run on.
    no_hardware_cursors = false
}
