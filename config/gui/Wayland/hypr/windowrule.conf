# System utility windows
windowrule = match:class ^(nwg-look)$, float on, center on

# Browser extension windows
windowrule = match:class ^(Chromium-browser)$, match:title ^_crx_, float on, center on, size 380 400

# File picker dialogs
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on, size 900 600

# Chromium file picker
windowrule = match:class ^(Chromium-browser)$, match:title ^(Open Files)$, float on, center on, size 900 500

# Thunderbird compose window
windowrule = match:class ^(thunderbird)$, match:title ^Write, float on, center on, size 60% 80%

# Social media apps (Element, Reddit)
windowrule = match:class ^(Chromium-browser)$, match:title ^(Element)|^(Reddit), float on, center on, size 90% 85%

# Calculator terminal
windowrule = match:class ^(floating-calculator)$, float on, center on, size 600 400

# ueberzugpp image preview overlay (for fzf image previews)
windowrule = match:class ^(ueberzugpp)$, float on, no_focus on, pin on, no_anim on, border_size 0, no_shadow on

# Receipt import — standalone Alacritty window auto-launched from tmux
windowrule = match:class ^(floating-receipt-import)$, float on, center on, size 60% 70%
