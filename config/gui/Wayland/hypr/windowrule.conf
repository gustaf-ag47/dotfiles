# System utility windows
windowrule = match:class ^(nwg-look)$, float on, center on

# Browser extension windows
windowrule = match:class ^(Chromium-browser)$, match:title ^_crx_, float on, center on, size 380 400

# File picker dialogs
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on, size 900 600


# Calculator terminal
windowrule = match:class ^(floating-calculator)$, float on, center on, size 600 400

# ueberzugpp image preview overlay (for fzf image previews)
windowrule = match:class ^(ueberzugpp)$, float on, no_focus on, pin on, no_anim on, border_size 0, no_shadow on

# Receipt import — standalone Alacritty window auto-launched from tmux

# skrubben cobrowse viewer — always pinned to workspace 4
windowrule = match:class ^(skrubben-cobrowse)$, workspace 4 silent
windowrule = match:title ^(skrubben cobrowse)$, workspace 4 silent

# Reading split (bin/read-book): zathura left, the literature note in nvim right
windowrule = match:class ^(reading-notes)$, workspace name:reading

# Layer surfaces of the desktop shell. wlogout (bin/power) sits in a small
# centred layer, so dim the rest of the output around it; blur the swaync
# control centre and the swayosd pill like other popups.
layerrule = match:namespace ^(logout_dialog)$, dim_around on
layerrule = match:namespace ^(swaync-control-center)$, blur on, ignore_alpha 0.2
layerrule = match:namespace ^(swaync-notification-window)$, blur on, ignore_alpha 0.2
layerrule = match:namespace ^(swayosd)$, blur on, ignore_alpha 0.2
layerrule = match:namespace ^(eww-popover)$, blur on, ignore_alpha 0.2
