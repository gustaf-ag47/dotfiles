autogenerated = 0

# NVIDIA environment variables
# GBM_BACKEND=nvidia-drm is intentionally omitted: it broke with nvidia-open 555+
# and causes DRM device failures on resume from s2idle.
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
}

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once=systemctl --user import-environment
exec-once=hypridle
exec-once=udiskie
exec-once=/usr/lib/polkit-kde-authentication-agent-1
exec-once=waybar --config $DOTFILES/config/gui/Wayland/waybar/config --style $DOTFILES/config/gui/Wayland/waybar/style.css
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=pypr


input {
    kb_layout = se
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_delay = 300
    repeat_rate = 50
    follow_mouse = 2
    float_switch_override_focus = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    col.active_border=rgb(7aa2f7)
    col.inactive_border=rgb(1a1b26)
}

decoration {
    rounding = 12
    
    blur {
        enabled = true
        size = 8
        passes = 3
        xray = false
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        ignore_opacity = false
        popups = true
        popups_ignorealpha = 0.2
    }
    
    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 0
        color = rgba(1a1b26aa)
        color_inactive = rgba(1a1b2655)
    }
    
    dim_inactive = false
    dim_strength = 0.1
}

animations {
    enabled = false
}

xwayland {
  # force_zero_scaling = true
  # Commented out to allow proper HiDPI scaling for XWayland apps
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

source = $XDG_CONFIG_HOME/hypr/keymap.conf
source = $XDG_CONFIG_HOME/hypr/windowrule.conf

# Host-specific configuration (monitors, laptop features, etc.)
# Symlink created by install.sh at ~/.config/hypr-host.conf -> hosts/$(hostname).conf
source = ~/.config/hypr-host.conf
