# Pyprland configuration
# Scratchpads and other Hyprland extensions

[pyprland]
# expose: Super+E shows every window on the current workspace (overview).
# toggle_special: stash a window to the special workspace and back.
plugins = ["scratchpads", "expose", "toggle_special"]

[expose]
include_special = false

[scratchpads.term]
command = "terminal --class=dotfiles.scratchpad"
class = "dotfiles.scratchpad"
size = "75% 60%"
position = "center"
animation = "fromTop"

[scratchpads.btop]
command = "terminal --class=dotfiles.btop -e btop"
class = "dotfiles.btop"
size = "80% 80%"
position = "center"
animation = "fromTop"

[scratchpads.lazygit]
command = "terminal --class=dotfiles.lazygit -e lazygit"
class = "dotfiles.lazygit"
size = "90% 85%"
position = "center"
animation = "fromTop"

[scratchpads.yazi]
command = "terminal --class=dotfiles.yazi -e yazi"
class = "dotfiles.yazi"
size = "80% 80%"
position = "center"
animation = "fromTop"
