# Pyprland configuration
# Scratchpads and other Hyprland extensions

[pyprland]
# expose: Super+E shows every window on the current workspace (overview).
# toggle_special: stash a window to the special workspace and back.
plugins = ["scratchpads", "expose", "toggle_special"]

[expose]
include_special = false

[scratchpads.term]
command = "alacritty --class=scratchpad"
class = "scratchpad"
size = "75% 60%"
position = "center"
animation = "fromTop"

[scratchpads.btop]
command = "alacritty --class=btop-scratch -e btop"
class = "btop-scratch"
size = "80% 80%"
position = "center"
animation = "fromTop"

[scratchpads.lazygit]
command = "alacritty --class=lazygit-scratch -e lazygit"
class = "lazygit-scratch"
size = "90% 85%"
position = "center"
animation = "fromTop"

[scratchpads.yazi]
command = "alacritty --class=yazi-scratch -e yazi"
class = "yazi-scratch"
size = "80% 80%"
position = "center"
animation = "fromTop"
