$mainMod = SUPER

bind = $mainMod            , RETURN                , exec                          , terminal
bind = $mainMod            , A                     , exec                          , capture
bind = $mainMod SHIFT      , A                     , exec                          , anki-capture
bind = $mainMod SHIFT      , Q                     , killactive                    ,
bind = $mainMod            , P                     , togglefloating                ,
bind = $mainMod SHIFT      , P                     , pseudo                        ,
bind = $mainMod            , T                     , layoutmsg                     , togglesplit
bind = $mainMod            , F                     , fullscreen                    , 0
bind = $mainMod SHIFT      , F                     , fullscreen                    , 1
bind = SUPER               , V                     , exec                          , clipboardman
bind = SUPER SHIFT         , V                     , exec                          , linkhandler -r

bind = $mainMod            , SPACE                 , exec                          , launch-apps
bind = $mainMod            , B                     , exec                          , launch-pdf
bind = $mainMod SHIFT      , B                     , exec                          , read-book
bind = $mainMod            , R                     , exec                          , filemanager
bind = $mainMod CTRL       , Q                     , exec                          , power
bind = $mainMod CTRL SHIFT , L                     , exec                          , lock
bind = $mainMod            , S                     , exec                          , screenshot
bind = $mainMod            , C                     , exec                          , terminal-calculator

bind =                     , XF86MonBrightnessUp   , exec                          , backlight --inc
bind =                     , XF86MonBrightnessDown , exec                          , backlight --dec

bind = SUPER               , F5                    , exec                          , kbbacklight --dec
bind = SUPER SHIFT         , F5                    , exec                          , kbbacklight --inc

bindl =                    , XF86AudioRaiseVolume  , exec                          , volume --inc
bindl =                    , XF86AudioLowerVolume  , exec                          , volume --dec
bindl =                    , XF86AudioMicMute      , exec                          , volume --toggle-mic
bindl =                    , XF86AudioMute         , exec                          , volume --toggle

bindl =                    , XF86AudioPlay         , exec                          , playerctl play-pause
bindl =                    , XF86AudioPause        , exec                          , playerctl play-pause
bindl =                    , XF86AudioNext         , exec                          , playerctl next
bindl =                    , XF86AudioPrev         , exec                          , playerctl previous

# Move the focused window in a direction; at a monitor edge it crosses to the
# neighbouring monitor (follows the layout pinned in hosts/<host>.conf).
bind = $mainMod CTRL       , h                     , movewindow                    , l
bind = $mainMod CTRL       , l                     , movewindow                    , r
bind = $mainMod CTRL       , k                     , movewindow                    , u
bind = $mainMod CTRL       , j                     , movewindow                    , d
# Carry the whole workspace (e.g. the one Super+1 shows) to the monitor in
# that direction; the windows stay together, only the screen changes.
bind = $mainMod SHIFT      , h                     , movecurrentworkspacetomonitor , l
bind = $mainMod SHIFT      , l                     , movecurrentworkspacetomonitor , r
bind = $mainMod SHIFT      , k                     , movecurrentworkspacetomonitor , u
bind = $mainMod SHIFT      , j                     , movecurrentworkspacetomonitor , d

# Workspace switching: Tab walks forward through every open workspace
# (1 -> 2 -> 4 -> 10 -> 1, focus follows to the monitor that shows it),
# Shift+Tab walks backwards.
bind = $mainMod            , Tab                   , workspace                     , e+1
bind = $mainMod SHIFT      , Tab                   , workspace                     , e-1

bind = $mainMod            , h                     , movefocus                     , l
bind = $mainMod            , l                     , movefocus                     , r
bind = $mainMod            , k                     , movefocus                     , u
bind = $mainMod            , j                     , movefocus                     , d

bind = $mainMod            , 1                     , workspace                     , 1
bind = $mainMod            , 2                     , workspace                     , 2
bind = $mainMod            , 3                     , workspace                     , 3
bind = $mainMod            , 4                     , workspace                     , 4
bind = $mainMod            , 5                     , workspace                     , 5
bind = $mainMod            , 6                     , workspace                     , 6
bind = $mainMod            , 7                     , workspace                     , 7
bind = $mainMod            , 8                     , workspace                     , 8
bind = $mainMod            , 9                     , workspace                     , 9
bind = $mainMod            , 0                     , workspace                     , 10

bind = $mainMod SHIFT      , 1                     , movetoworkspace               , 1
bind = $mainMod SHIFT      , 2                     , movetoworkspace               , 2
bind = $mainMod SHIFT      , 3                     , movetoworkspace               , 3
bind = $mainMod SHIFT      , 4                     , movetoworkspace               , 4
bind = $mainMod SHIFT      , 5                     , movetoworkspace               , 5
bind = $mainMod SHIFT      , 6                     , movetoworkspace               , 6
bind = $mainMod SHIFT      , 7                     , movetoworkspace               , 7
bind = $mainMod SHIFT      , 8                     , movetoworkspace               , 8
bind = $mainMod SHIFT      , 9                     , movetoworkspace               , 9
bind = $mainMod SHIFT      , 0                     , movetoworkspace               , 10

# Scratchpads (pyprland)
bind = $mainMod            , grave                 , exec                          , pypr toggle term
bind = $mainMod SHIFT      , T                     , exec                          , pypr toggle btop
bind = $mainMod SHIFT      , G                     , exec                          , pypr toggle lazygit
bind = $mainMod SHIFT      , Y                     , exec                          , pypr toggle yazi
