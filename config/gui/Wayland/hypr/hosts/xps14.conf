# Host-specific config for: xps14 (Dell XPS 14, 2026, DA14260)
# Linked to ~/.config/hypr-host.conf by scripts/install.sh.
# Premises: docs/research/machine-profiles-and-xps14.md

# Internal panel is one of:
#   2880x1800 OLED, 20-120 Hz VRR  -> scale 1.6 (1800x1125 effective)
#   1920x1200 IPS,   1-120 Hz VRR  -> scale 1.25 (1536x960 effective)
# "auto" until the delivered panel is known; pin it after first boot with
# `hyprctl monitors`.
monitor=eDP-1,preferred,auto,auto

# External displays: only USB-C/Thunderbolt (DP 2.1 alt mode). The generic
# fallback in hyprland.conf handles them until a desk layout is pinned here.

# Laptop-specific startup
exec-once=$DOTFILES/bin/battery-monitor --daemon

# Lid switch: DPMS-only, never `keyword monitor` (use-after-free crash in
# Aquamarine on reconnect). Full rationale: CLAUDE.md § "Lid switch handling".
# No NVIDIA here, so no 2 s settle delay on lid open (that was for the XPS 15's
# NVIDIA/i915 resume sequence).
bindl=,switch:on:Lid Switch,exec,hyprctl dispatch dpms off eDP-1
bindl=,switch:off:Lid Switch,exec,hyprctl dispatch dpms on

# Attach to a Chrome running on skrubben (co-browse picker; laptop-cobrowse skill)
bind = $mainMod, O, exec, ~/.pi/agent/skills/laptop-cobrowse/scripts/skrubben-chrome-picker.sh
