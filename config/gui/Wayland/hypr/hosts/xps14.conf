# Host-specific config for: xps14 (Dell XPS 14, 2026, DA14260)
# Linked to ~/.config/hypr-host.conf by scripts/install.sh.
# Premises: $NOTES/40 Wiki/Dotfiles Research/Machine Profiles and XPS14.md

# Internal panel: 2880x1800 OLED (LG 0x07C6), 120 Hz. Scale 1.6 -> 1800x1125
# logical, per the premises note. The 1920x1200 IPS variant would take 1.25.
monitor=eDP-1,2880x1800@120,3580x2160,1.6

# Desk (logical px, scale applied). Only USB-C/Thunderbolt (DP 2.1 alt mode).
#
#   +----------------+----------------------------+
#   | DP-2 QHD 2560  |  DP-1 4K 3840x2160         |   DP-2 bottom-aligned with DP-1
#   | x1440 @0x720   |  @2560x0                   |
#   +----------------+--------+-----------+-------+
#                             | eDP-1     |           laptop centred under DP-1
#                             | 1800x1125 |
#                             +-----------+
monitor=desc:LG Electronics LG HDR 4K 0x0004DFFA,3840x2160@60,2560x0,1
monitor=desc:LG Electronics LG IPS QHD 512NTPCL8896,2560x1440@60,0x720,1
# Anything else: generic fallback in hyprland.conf (preferred, auto, 1).

# Laptop-specific startup
exec-once=$DOTFILES/bin/battery-monitor --daemon

# Lid switch: DPMS-only, never `keyword monitor` (use-after-free crash in
# Aquamarine on reconnect). Full rationale: $NOTES/Homelab/dotfiles/HARDWARE.md, "Lid switch handling".
# No NVIDIA here, so no 2 s settle delay on lid open (that was for the XPS 15's
# NVIDIA/i915 resume sequence).
bindl=,switch:on:Lid Switch,exec,hyprctl dispatch dpms off eDP-1
bindl=,switch:off:Lid Switch,exec,hyprctl dispatch dpms on

# Attach to a Chrome running on skrubben (co-browse picker; laptop-cobrowse skill)
bind = $mainMod, O, exec, ~/.pi/agent/skills/laptop-cobrowse/scripts/skrubben-chrome-picker.sh
