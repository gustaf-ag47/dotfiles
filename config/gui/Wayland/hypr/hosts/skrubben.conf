# Host-specific config for: skrubben (Desktop PC, RTX 2080 Ti)
# Linked to ~/.config/hypr-host.conf by scripts/install.sh.

# Monitor: ASUS ROG XG27UQ, 3840x2160, on DP-2 (verified with `hyprctl monitors`,
# 2026-10-06). Any other output falls back to hyprland.conf's generic rule.
monitor=DP-2,preferred,0x0,1
# The panel also offers 3840x2160@144 (and 120/100). "preferred" picks 60 Hz.
# To try high refresh -- needs a DP 1.4 cable/DSC that holds it:
#   monitor=DP-2,3840x2160@144,0x0,1

# No lid switch handling needed for desktop
