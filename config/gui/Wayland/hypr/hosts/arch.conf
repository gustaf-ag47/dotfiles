# Host-specific config for: arch (Dell XPS 15 laptop)
# This file is sourced by hyprland.conf based on hostname

# Monitor configuration
# eDP-1: Built-in 3840x2400 display at 1.6x scale (effective 2400x1500)
# DP-*: External displays (USB-C/Thunderbolt)
monitor=eDP-1,3840x2400,0x2160,1.6
monitor=DP-1,3840x2160,0x0,1
monitor=DP-2,3840x2160,0x0,1
monitor=DP-3,3840x2160,0x0,1
monitor=DP-4,3840x2160,0x0,1

# Laptop-specific startup
exec-once=$DOTFILES/bin/battery-monitor --daemon

# Lid switch handling
#
# Use DPMS-only — never `hyprctl keyword monitor` here.
#
# `keyword monitor "eDP-1, disable"` tears down Aquamarine's SDRMConnector for
# eDP-1. On resume the reconnect path hits a use-after-free in CLogger inside
# SDRMConnector::disconnect(), crashing Hyprland (confirmed in coredump).
#
# `dispatch dpms off/on` only toggles display power; the DRM pipeline stays
# intact, so there is nothing to reconstruct after resume.
#
# switch:on  (lid closed): turn off the built-in display only; external monitors
#            stay active so clamshell-mode keeps working.
# switch:off (lid opened): wait 2 s for the NVIDIA/i915 resume sequence to
#            settle, then wake all outputs.  hypridle's after_sleep_cmd fires
#            immediately on wake and also sends dpms on — the duplicate is fine.
bindl=,switch:on:Lid Switch,exec,hyprctl dispatch dpms off eDP-1
bindl=,switch:off:Lid Switch,exec,sleep 2 && hyprctl dispatch dpms on
