# Night light (hyprsunset, first-party). Gamma/temperature on the output, so
# screenshots and recordings are not tinted. Toggle from the swaync control
# centre (bin/nightlight). Linked with the rest of hypr/ by scripts/install.sh.
max-gamma = 100

profile {
    time = 07:30
    identity = true
}

profile {
    time = 21:00
    temperature = 5000
    gamma = 0.95
}
