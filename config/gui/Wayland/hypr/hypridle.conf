general {
    # Run when a DBus Lock() signal arrives (loginctl lock-session, etc.)
    lock_cmd = pidof hyprlock || hyprlock-safe

    # Lock before the system suspends so the screen is never exposed on wake.
    # inhibit_sleep = 2 holds a systemd sleep inhibitor while before_sleep_cmd
    # runs, preventing suspend until locking has started.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on

    inhibit_sleep = 2
}

# Idle listeners (lock, screen off, dim) live in the class/host overlay picked by
# scripts/install.sh (hypridle/hosts/<host>.conf, else hypridle/class/<class>.conf).
# A host that must never idle (xps14) ships an overlay with no listeners; the
# general block above still makes manual locking (lock key, loginctl) work.
source = ~/.config/hypridle-host.conf
