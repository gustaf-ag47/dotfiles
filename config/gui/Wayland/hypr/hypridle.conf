general {
    # Run when a DBus Lock() signal arrives (loginctl lock-session, etc.)
    lock_cmd = pidof hyprlock || hyprlock-safe

    # Lock before the system suspends so the screen is never exposed on wake.
    # inhibit_sleep = 2 holds a systemd sleep inhibitor while before_sleep_cmd
    # runs, preventing suspend until locking has started.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on

    inhibit_sleep = 2
}

# Dim screen after 4 min of inactivity
listener {
    timeout   = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock after 5 min
listener {
    timeout   = 300
    on-timeout = loginctl lock-session
}

# Turn display off 60 s after locking — must be strictly after the lock
# listener to avoid the "timed out gathering resources" blank-screen bug
# where hyprlock starts with DPMS already off and fails to render.
listener {
    timeout   = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout   = 1800
    on-timeout = systemctl suspend
}
