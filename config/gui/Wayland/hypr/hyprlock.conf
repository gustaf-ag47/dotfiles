# Tokyo Night color scheme matches hyprland.conf
# blue:  7aa2f7   dark bg: 1a1b26   fg: c0caf5   red: f7768e

general {
    grace           = 0
    hide_cursor     = true
    ignore_empty_input = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    contrast    = 0.9
    brightness  = 0.8
}

label {
    monitor   =
    text      = cmd[update:1000] echo "$(date +'%H:%M')"
    color     = rgba(c0caf5ff)
    font_size = 72
    position  = 0, 120
    halign    = center
    valign    = center
}

label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color     = rgba(a9b1d6cc)
    font_size = 20
    position  = 0, 50
    halign    = center
    valign    = center
}

input-field {
    monitor           =
    size              = 280, 55
    position          = 0, -60
    halign            = center
    valign            = center
    outline_thickness = 2
    rounding          = 10
    inner_color       = rgb(1a1b26)
    outer_color       = rgb(7aa2f7)
    check_color       = rgb(7aa2f7)
    fail_color        = rgb(f7768e)
    font_color        = rgb(c0caf5)
    placeholder_text  = <i>Password</i>
    fail_text         = <i>incorrect</i>
    hide_input        = false
    dots_size         = 0.25
    dots_spacing      = 0.3
}
