# Wallpaper lives in the repo; ~/.config/hypr is a symlink into
# $DOTFILES/config/gui/Wayland/hypr, so a relative path survives any $DOTFILES
# location (hyprpaper resolves ~/.config/hypr/../../media via the symlink).
preload = ~/.config/hypr/../../media/wallpaper/tokyonight.jpg
wallpaper = ,~/.config/hypr/../../media/wallpaper/tokyonight.jpg

splash = false
ipc = on
