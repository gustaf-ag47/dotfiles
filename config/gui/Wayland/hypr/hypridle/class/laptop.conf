# hypridle laptop-class overlay: dim the backlight after 4 min, lock at 5,
# screen off at 6. Never suspends.
listener {
    timeout   = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Lock after 5 min
listener {
    timeout   = 300
    on-timeout = loginctl lock-session
}

# Turn display off 60 s after locking: must be strictly after the lock listener
# to avoid the "timed out gathering resources" blank screen where hyprlock starts
# with DPMS already off and fails to render.
listener {
    timeout   = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# No idle suspend. Suspend tears down WiFi and kicks the AX211 firmware into
# its crash loop (see bin/iwlwifi-watchdog), killing SSH/tmux/syncthing sessions
# after locking. Suspend manually (systemctl suspend) or via lid close instead.
