# hypridle host overlay for xps14. On AC: always on -- no dim, no idle lock,
# no screen off: the laptop sits on a desk with external monitors and
# long-running sessions, and closing the lid does not suspend either
# (system/hosts/xps14 logind drop-in). Lock by hand with the lock key or `lock`.
#
# On battery only: dim at 4 min, panel off at 6 min. condition_cmd is run when
# a timeout fires; non-zero defers it (re-checked every condition_retry s), so
# plugging in simply stops the listeners. Never locks, never suspends (see
# class/laptop.conf for why). An already-dimmed screen restores on activity,
# not on plug-in. Research: $NOTES/Homelab/dotfiles/runs/2026-10-17-xps14-battery/
# Refresh-rate switching is deliberately NOT done here: `hyprctl keyword
# monitor` is the path with the Aquamarine use-after-free on this host.

listener {
    timeout         = 240
    on-timeout      = brightnessctl -s set 10%
    on-resume       = brightnessctl -r
    condition_cmd   = test "$(cat /sys/class/power_supply/AC/online)" = 0
    condition_retry = 30
}

listener {
    timeout         = 360
    on-timeout      = hyprctl dispatch dpms off
    on-resume       = hyprctl dispatch dpms on
    condition_cmd   = test "$(cat /sys/class/power_supply/AC/online)" = 0
    condition_retry = 30
}
