unbind C-b
set -g prefix C-Space

unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded tmux conf"

unbind v
unbind h

unbind % 
unbind '"' 
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

set -g history-limit 10000

set -g mouse on

set -g extended-keys on

unbind n 
unbind w 

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

set -g base-index 1
set-window-option -g pane-base-index 1

bind -n M-j previous-window
bind -n M-k next-window

# Cycle windows (wraps around, no prefix needed)
bind -n M-Tab next-window
bind -n M-S-Tab previous-window
# Prefix twice (C-Space C-Space): toggle between the two most recently used
# windows. Note: prefix+Tab is taken by extrakto, so it is not used here.
bind C-Space last-window

set-window-option -g mode-keys vi

unbind -T copy-mode-vi Space; 
unbind -T copy-mode-vi Enter; 

bind -T copy-mode-vi v send-keys -X begin-selection
# Use the `copy` script which handles both local clipboard (wl-copy/xclip)
# and remote clipboard via OSC 52 DCS passthrough (works through SSH + nested tmux).
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "copy"

set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q' 

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Session persistence keybindings (using safe-save wrapper to prevent empty saves)
bind C-s run-shell "tmux-safe-save"
bind C-r run-shell "$XDG_CONFIG_HOME/tmux/plugins/tmux-resurrect/scripts/restore.sh"

# Visual settings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

set-window-option -g monitor-activity off
set -g bell-action none

set-option -g set-titles on
set-option -g set-titles-string '#S'

set -g status-position bottom
set -g status-interval 2

set-option -sg escape-time 10
set-option -g focus-events on

# Update environment variables for Wayland/Hyprland support
# SSH_AUTH_SOCK: needed for SSH agent forwarding in new panes
# PATH: ensures clipboard tools (wl-copy, xclip) are found after re-attach
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE TERM TERM_PROGRAM SSH_AUTH_SOCK PATH"

set-option -g default-terminal "tmux-256color";
set-option -sa terminal-features ',alacritty:RGB:clipboard'
set-option -sa terminal-features ',tmux-256color:clipboard'
set-option -sa terminal-features ',screen-256color:clipboard'
set-option -sa terminal-features ',xterm-256color:clipboard'

# ============================================================================
# OSC 52 Clipboard (works through SSH and nested tmux sessions)
# ============================================================================
# "on" (not "external") is required for nested tmux: the outer tmux must
# accept OSC 52 from the inner tmux (which is an "application inside tmux").
# With "external" (the default), the outer tmux blocks this.
set -s set-clipboard on

# Allow DCS passthrough so apps like Neovim can send OSC 52 through tmux.
# Without this, Neovim's built-in OSC 52 clipboard gets silently dropped.
set -g allow-passthrough on

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#16161e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"

# ============================================================================
# F9 Toggle for Nested Tmux Sessions
# ============================================================================
# When SSH'd from laptop (local tmux) to PC (remote tmux), press F9 to
# toggle between controlling local vs remote tmux session.
#
# F9 = Disable local tmux (pass all keys to remote)
# F9 again = Re-enable local tmux
#
# Visual indicator: Status bar changes color when in "remote mode"
# ============================================================================

# Color definitions for remote mode (dimmed Tokyo Night colors)
color_remote_bg="#1f2335"           # Darker background for remote mode
color_remote_fg="#565f89"           # Dimmed foreground for remote mode
color_remote_indicator="#f7768e"    # Red indicator for "REMOTE" text
color_normal_bg="#16161e"           # Normal status background
color_normal_fg="#7aa2f7"           # Normal status foreground

# F9 pressed: Enter "remote mode" (disable local tmux keybindings)
bind -T root F9 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_remote_fg,bg=$color_remote_bg" \;\
  set status-left "#[fg=#1a1b26,bg=$color_remote_indicator,bold] 🔴 REMOTE #[fg=$color_remote_indicator,bg=$color_remote_bg]#[fg=$color_remote_indicator,bg=$color_remote_bg] #S #[fg=$color_remote_bg,bg=$color_remote_bg]" \;\
  set window-status-current-format "#[fg=$color_remote_bg,bg=$color_remote_indicator]#[fg=#15161e,bg=$color_remote_indicator,bold] #I  #W #F #[fg=$color_remote_indicator,bg=$color_remote_bg]" \;\
  set window-status-current-style "fg=$color_remote_fg,bg=$color_remote_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

# F9 pressed in "off" table: Exit "remote mode" (re-enable local tmux)
bind -T off F9 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S


# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_clip_tool_run "tmux_osc52"  # Use OSC 52 so copy works over SSH
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3 irb pry "~watch -n 1 *"'
set -g @resurrect-dir '$HOME/sync/Vault/tmux-resurrect'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# Note: @continuum-boot only works on macOS, removed for Linux

# status-right must be set BEFORE tpm runs so continuum can prepend its
# #(continuum_save.sh) poll hook — overriding AFTER wipes it silently.
set -g status-right "#[fg=#f7768e,bg=#16161e]#([ $(tmux show-option -qv key-table) = 'off' ] && echo ' 🔴 REMOTE ')#[default]"

run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"
