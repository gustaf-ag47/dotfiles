# Waybar was an exec-once child: when it exited (monitor hotplug/lid events)
# nothing brought it back. Run the packaged unit with the dotfiles config and
# always restart it.
[Unit]
# The packaged unit has Requisite=graphical-session.target: it refuses to start
# unless something already activated the target. Hyprland does not, and
# hyprland.conf starts Waybar before hyprsunset (which Requires= it), so on a
# fresh session waybar.service failed with result 'dependency' (skrubben,
# 2026-11-11). Pull the target in ourselves, as hyprsunset.service does.
Requires=graphical-session.target
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
ExecStart=
ExecStart=/usr/bin/waybar --config %h/sync/src/dotfiles/config/gui/Wayland/waybar/config --style %h/sync/src/dotfiles/config/gui/Wayland/waybar/style.css
Restart=always
RestartSec=2
