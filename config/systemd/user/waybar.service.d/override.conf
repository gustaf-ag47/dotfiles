# Waybar was an exec-once child: when it exited (monitor hotplug/lid events)
# nothing brought it back. Run the packaged unit with the dotfiles config and
# always restart it.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
ExecStart=
ExecStart=/usr/bin/waybar --config %h/sync/src/dotfiles/config/gui/Wayland/waybar/config --style %h/sync/src/dotfiles/config/gui/Wayland/waybar/style.css
Restart=always
RestartSec=2
