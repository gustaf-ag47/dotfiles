# Hermes durable state lives in $SYNC/hermes and is bind-mounted into
# ~/.hermes (fstab, see config/hermes/README.md). Refuse to start if a mount
# is missing (encrypted nvme not unlocked) instead of writing into the empty,
# immutable mountpoint dirs. Restart=always retries until the mounts appear.
# RequiresMountsFor= adds native systemd ordering on top of the guards below:
# the guards alone retry-and-wait but do not tell systemd to order this unit
# after the mount, so without it a unit started very early in the session can
# still race the mount on its first attempt. It resolves by PATH, which also
# works for a plain system mount a --user manager cannot see by unit name —
# naming mnt-my_encrypted_nvme.mount directly in After= fails verification.
[Unit]
RequiresMountsFor=%h/sync

[Service]
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/memories
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/skills
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/handovers
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/scripts
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/assets
ExecStartPre=/usr/bin/mountpoint -q %h/.hermes/sessions
