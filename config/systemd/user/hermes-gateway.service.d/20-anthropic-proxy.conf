# Route Hermes Anthropic traffic through claude-token-proxy the same way Pi
# does (config/pi/extensions/anthropic-pool.ts + config/claude-code/env.sh).
# Cron workers spawned via systemd-run do not inherit the user manager env, so
# this must live on the gateway unit — and model.base_url in config.yaml is the
# other half. Proxy swaps the Authorization header; the launch OAuth token is
# only a dummy.
[Unit]
After=claude-token-proxy.service
Wants=claude-token-proxy.service

[Service]
Environment=ANTHROPIC_BASE_URL=http://127.0.0.1:8788/anthropic
Environment=CC_PROXY_PORT=8788
