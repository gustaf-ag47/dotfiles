# tmux 3.8 puts every pane in its own transient tmux-spawn-<uuid>.scope directly
# under user@.service, next to app.slice (Ghostty, Waybar) and session.slice.
# At the default weight (100) each busy agent pane counts as much as the whole
# terminal, so 10 agents running test suites starve Ghostty and the bar.
# tmux.service's CPUWeight=15 never applied: the server usually starts from a
# terminal inside the Hyprland session scope, and panes leave its cgroup anyway.
# A prefix drop-in reaches every pane scope however tmux was started.
[Scope]
CPUWeight=15
