# tmux 3.8 puts every pane in its own transient tmux-spawn-<uuid>.scope directly
# under user@.service, next to app.slice (Ghostty, Waybar) and session.slice.
# tmux.service's CPUWeight never applied: the server usually starts from a
# terminal inside the Hyprland session scope, and panes leave its cgroup anyway.
# A prefix drop-in reaches every pane scope however tmux was started; it moves
# them into agents.slice, which holds the fleet's shared, low weight.
[Scope]
Slice=agents.slice
