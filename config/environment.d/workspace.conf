# Workspace-as-code: the same identifiers the zsh env exports, available to
# systemd --user units that never source a login shell (ws-up.service and
# anything it launches). environment.d expands ${HOME}, never systemd's %h:
# %h stayed literal and ws-up created sessions in "%h/sync/..." (2026-10-15).
SYNC=${HOME}/sync
NOTES=${HOME}/sync/Vault
DOTFILES=${HOME}/sync/src/dotfiles
SRC=${HOME}/sync/src
WORKTREES=/mnt/my_encrypted_nvme/scratch/tmp
