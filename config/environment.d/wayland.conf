# Wayland environment configuration
# Set environment variables for proper Wayland support

# Firefox Wayland support
MOZ_ENABLE_WAYLAND=1
MOZ_WEBRENDER=1
MOZ_ACCELERATED=1

# General Wayland settings
GDK_BACKEND=wayland,x11
QT_QPA_PLATFORM=wayland;xcb
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland

# Desktop identity (XDG_SESSION_TYPE / XDG_CURRENT_DESKTOP) is deliberately NOT
# set here: Hyprland exports it for its own session, and forcing it globally
# breaks the i3/X11 session this repo also supports.