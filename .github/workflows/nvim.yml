name: Neovim Config

on:
  push:
    paths:
      - 'config/nvim/**'
      - '.github/workflows/nvim.yml'
  pull_request:
    paths:
      - 'config/nvim/**'
      - '.github/workflows/nvim.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lua 5.1 matches the luajit std used by Neovim / .luacheckrc, provides
      # `luac` for the syntax check, and avoids the luacheck-on-Lua-5.5 breakage.
      - name: Setup Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Check Lua syntax (luac)
        run: |
          find config/nvim/lua -name '*.lua' -print0 \
            | xargs -0 -n1 luac -p
          echo "✓ All Lua files parse cleanly"

      - name: Check formatting (StyLua)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check config/nvim/

      - name: Lint Lua (luacheck)
        run: |
          luarocks install luacheck
          luacheck config/nvim/lua --config .luacheckrc

  load-test:
    name: Headless load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Cache lazy.nvim plugins
        uses: actions/cache@v6
        with:
          path: /tmp/nvim-ci-data
          key: ${{ runner.os }}-nvim-lazy-${{ hashFiles('config/nvim/lazy-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nvim-lazy-

      - name: Test config loads (minimal)
        run: |
          XDG_CONFIG_HOME=/tmp/nvim-ci-config \
          XDG_DATA_HOME=/tmp/nvim-ci-data \
          XDG_STATE_HOME=/tmp/nvim-ci-state \
          XDG_CACHE_HOME=/tmp/nvim-ci-cache \
          nvim --headless -u config/nvim/minimal.lua \
            -c "lua vim.defer_fn(function() vim.cmd('qa!') end, 5000)" \
            2>&1 | tee /tmp/nvim-load.log
          echo "Exit code: $?"

      - name: Upload load log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nvim-load-log
          path: /tmp/nvim-load.log
