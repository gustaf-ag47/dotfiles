name: dotfiles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift canary. Deliberately NOT on the hour: GitHub delays and can
    # silently drop scheduled runs during the high-load window at :00.
    # NOTE: on a public repo, scheduled workflows are auto-disabled after 60
    # days with no repository activity. If this repo goes quiet, re-enable it
    # under Actions -> dotfiles -> Enable workflow.
    - cron: "23 5 * * 1"

concurrency:
  group: dotfiles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: bash -n on every shell script
        run: |
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*(bash|sh)' || continue
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; rc=1; fi
          done < <(find bin scripts tests config/git/hooks -type f 2>/dev/null)
          exit $rc
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          # -x follows sourced files. Installer-critical rules are errors:
          # SC2115 (rm -rf on a maybe-empty var), SC2086/SC2046 (unquoted
          # expansion feeding rm/ln), SC2164 (unguarded cd).
          shellcheck -x -S warning scripts/*.sh tests/*.sh
          # bin/ holds extensionless scripts in several languages; check the
          # shell ones at the same severity.
          mapfile -t bin_shell < <(find bin config/git/hooks -maxdepth 1 -type f \
            -exec sh -c 'head -1 "$1" | grep -qE "^#!.*(bash|sh)" && echo "$1"' _ {} \;)
          shellcheck -x -S warning "${bin_shell[@]}"

  unit:
    name: python + node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test-unit
      - run: make test-node
      - name: git bundle round trip (git-bundle-backup + git-rehydrate)
        run: bash tests/git-bundles.sh

  install:
    name: make install on archlinux (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `latest` is the drift canary: it is meant to break when upstream
        # moves, which is the entire point of the weekly run.
        image: ["archlinux:latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Run the real installer on a fresh Arch container
        run: |
          # --pull=always defeats any stale local image so the weekly run
          # genuinely tests today's Arch.
          docker run --rm --pull=always -v "$PWD:/src:ro" ${{ matrix.image }} bash -c '
            set -e
            pacman -Syu --noconfirm --needed \
              base-devel git rsync zsh tmux neovim curl fzf sudo python jq >/dev/null
            useradd -m -G wheel tester
            install -d -o tester -g tester /home/tester/sync/src
            rsync -a --exclude .git --exclude local /src/ /home/tester/sync/src/dotfiles/
            chown -R tester:tester /home/tester/sync
            su - tester -c "cd ~/sync/src/dotfiles && make install"
            su - tester -c "cd ~/sync/src/dotfiles && bash tests/install-assertions.sh"
            su - tester -c "cd ~/sync/src/dotfiles && bash tests/idempotency.sh"
          '

  system-layer:
    name: system layer (fake root + package canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: apply every profile into a fake root, resolve every package
        run: |
          # Inside archlinux:latest so the package check sees today's repos:
          # a renamed/dropped package in system/*/packages fails here, not on
          # a fresh machine mid-install.
          docker run --rm --pull=always -v "$PWD:/src:ro" \
            archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed diffutils python >/dev/null
            cp -a /src /tmp/dotfiles
            cd /tmp/dotfiles
            SYSTEM_LAYER_RESOLVE=1 bash tests/system-layer.sh
          '

  bootstrap-kit:
    name: bootstrap kit round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: round trip with the fake (file) adapter
        run: bash tests/bootstrap-kit.sh
      - name: preflight / terminal detection
        run: bash tests/bootstrap-preflight.sh

  # Opens/updates a single tracking issue when the weekly canary breaks, so a
  # scheduled failure is not just a red dot nobody sees.
  notify:
    name: report weekly failure
    if: failure() && github.event_name == 'schedule'
    needs: [lint, unit, install, system-layer, bootstrap-kit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'Weekly dotfiles install canary is failing';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled \`dotfiles\` workflow failed.\n\nRun: ${url}\n\nThis usually means upstream Arch moved: a package was renamed or dropped, or a new dependency is needed.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-canary',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-canary'],
              });
            }
